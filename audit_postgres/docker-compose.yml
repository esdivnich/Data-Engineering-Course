services:
  db:
    build: .
    container_name: audit_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      TZ: Asia/Yekaterinburg
      # библиотека pg_cron загружается сразу при старте сервера,
      # задачи расписания живут в БД app, весь проект работает по времени Ектеринбурга UTC+5
    command: >
      postgres
      -c shared_preload_libraries=pg_cron 
      -c cron.database_name=app
      -c cron.timezone=Asia/Yekaterinburg
      -c timezone=Asia/Yekaterinburg

    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
