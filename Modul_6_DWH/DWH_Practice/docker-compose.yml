services:
  db:
    image: postgres:15
    container_name: my_postgres_compose
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata_compose:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: my_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_PASSWORD: mysecretpassword
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  pgdata_compose:
  clickhouse_data: